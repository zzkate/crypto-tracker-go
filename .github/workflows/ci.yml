name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build & tests (Go)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://test:test@localhost:5432/test?sslmode=disable
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: gofmt
        run: test -z "$(gofmt -l .)"

      - name: go vet
        run: go vet ./...

      - name: staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@latest ./...

      - name: go test -race
        run: go test -race -count=1 ./...

      - name: coverage
        run: |
          go test -coverprofile=coverage.out -count=1 ./...
          go tool cover -func=coverage.out | tail -1

      - name: shuffle (order independence)
        run: go test -shuffle=on -count=1 ./...

  bench:
    name: Benchmarks
    runs-on: ubuntu-latest
    needs: test
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://test:test@localhost:5432/test?sslmode=disable
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Run benchmarks
        run: go test -bench=. -benchmem -run=^$ -benchtime=200ms -count=1 ./...

  docker:
    name: Docker build & smoke
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image
        run: docker build -t crypto-tracker-go:ci .

      - name: Check APP_API_KEY secret
        env:
          APP_API_KEY: ${{ secrets.APP_API_KEY }}
        run: |
          if [ -z "$APP_API_KEY" ]; then
            echo "::error::Repository secret APP_API_KEY is not set"
            exit 1
          fi

      - name: Run postgres + app
        env:
          APP_API_KEY: ${{ secrets.APP_API_KEY }}
        run: |
          docker network create cg-net
          docker run -d --name cg-db --network cg-net \
            -e POSTGRES_USER=crypto -e POSTGRES_PASSWORD=crypto -e POSTGRES_DB=crypto \
            postgres:16-alpine
          docker run -d --name cg-app --network cg-net -p 3000:3000 \
            -e APP_API_KEY="$APP_API_KEY" \
            -e DATABASE_URL="postgres://crypto:crypto@cg-db:5432/crypto?sslmode=disable" \
            crypto-tracker-go:ci

      - name: Wait for /health
        run: |
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:3000/health; then exit 0; fi
            sleep 1
          done
          echo "app did not become healthy"
          docker logs cg-app || true
          exit 1

      - name: Cleanup
        if: always()
        run: |
          docker rm -f cg-app cg-db || true
          docker network rm cg-net || true
