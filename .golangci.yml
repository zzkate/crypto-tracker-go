version: "2"

run:
  timeout: 5m

linters:
  default: standard
  enable:
    - unconvert
    - misspell
    - nilerr
  settings:
    errcheck:
      exclude-functions:
        - (*database/sql.Rows).Close
        - (*database/sql.Tx).Rollback
        - (*database/sql.DB).Close
        - fmt.Fprintf
        - fmt.Fprintln
        - fmt.Fprint
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - errcheck
